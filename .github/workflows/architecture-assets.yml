name: Acquire licensed educational photographs
on:
  push:
    branches:
      - feat/008-architecture-learning
    paths:
      - .github/workflows/architecture-assets.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  download:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Download the licensed Wikimedia Commons thumbnails
        run: python3 scripts/download-architecture-photos.py
      - name: Commit the downloaded photographs into this feature branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/architecture/*.jpg
          if git diff --cached --quiet; then
            echo "All images were already committed"
          else
            git commit -m "assets(education): vendor licensed architectural photos from Wikimedia Commons"
            git push origin HEAD:refs/heads/feat/008-architecture-learning
          fi
